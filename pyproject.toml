[project]
name = "personal-ai-os"
version = "0.1.0"
description = "Local personal AI OS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agno>=2,<3",
    "openai>=1.90,<3",
    "pydantic>=2.10,<3",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
